# Publish to npm on a version tag.
#
# Authentication is npm Trusted Publishing (OIDC): no token, no secret. It
# requires a one-time setup on npmjs.com — package → Settings → Trusted
# Publisher: repository `liuzwZYW/dsh-pwa-ui`, workflow `publish.yml`.
# The first publish of a brand-new package cannot use OIDC (the package must
# already exist to carry that setting), so it is done once with a token.
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      # Publish through the OIDC exchange alone. setup-node writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into the user
      # config and exports that variable, so the job would otherwise carry a
      # token and npm would authenticate with it instead of trading the GitHub
      # OIDC token for a short-lived publish credential — which the registry
      # rejects with "OIDC permission denied for this action".
      - name: Publish (OIDC only, no token in the environment)
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            : > "${NPM_CONFIG_USERCONFIG}"
          fi
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
